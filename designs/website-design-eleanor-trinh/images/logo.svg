<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Circular Paths for Arched Text -->
    <!-- Top Arc for CHIACTIVE -->
    <path id="top-arc" d="M 85,250 A 165,165 0 1,1 415,250" fill="none" />
    <!-- Bottom Arc for EST. CHICAGO -->
    <path id="bottom-arc" d="M 415,250 A 165,165 0 0,1 85,250" fill="none" />
    
    <!-- Shadow filter for authentic patch depth -->
    <filter id="patch-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Black Stitched Border -->
  <circle cx="250" cy="250" r="236" fill="#0D1117" filter="url(#patch-shadow)" />
  <circle cx="250" cy="250" r="232" fill="none" stroke="#222831" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Outer Deep Chicago Blue Ring -->
  <circle cx="250" cy="250" r="222" fill="#0B4F8A" />

  <!-- Inner Cream / Ivory Separator Ring -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#FFF7E2" stroke-width="8" />

  <!-- Inner Sky / Baby Blue Circle -->
  <circle cx="250" cy="250" r="158" fill="#2DAFE8" />

  <!-- 6-Pointed Chicago Star (Red with crisp dark edge) -->
  <g id="chicago-star" transform="translate(250, 230)">
    <!-- 6-point star geometry -->
    <polygon points="
      0,-108
      24,-38
      94,-54
      46,4
      94,62
      24,46
      0,116
      -24,46
      -94,62
      -46,4
      -94,-54
      -24,-38"
      fill="#EE1C38"
      stroke="#B30F26"
      stroke-width="3"
      stroke-linejoin="round" />
  </g>

  <!-- Bottom Mountain Peaks / Skyline in Warm Cream with Deep Blue Shadows -->
  <g id="mountains">
    <!-- Base silhouette filling lower circle -->
    <path d="M 120,330 
             L 165,295 L 185,315 L 235,270 L 250,290 L 285,255 L 320,305 L 350,285 L 380,330
             A 158,158 0 0,1 120,330 Z" 
          fill="#FFF0C8" />
    
    <!-- Mountain Shadow Facets in Deep Blue -->
    <polygon points="235,270 250,290 285,255 272,310 235,320" fill="#0B4F8A" opacity="0.9" />
    <polygon points="165,295 185,315 178,335 150,330" fill="#0B4F8A" opacity="0.85" />
    <polygon points="285,255 320,305 305,325 285,310" fill="#0B4F8A" opacity="0.9" />
    <polygon points="350,285 380,330 340,335" fill="#0B4F8A" opacity="0.85" />
  </g>

  <!-- Arched Typography in Warm Cream (#FFF7E2) matching original patch -->
  <!-- CHIACTIVE Arched at Top -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="#FFF7E2" 
        letter-spacing="5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      CHIACTIVE
    </textPath>
  </text>

  <!-- EST. CHICAGO Arched at Bottom -->
  <text font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" 
        font-weight="800" 
        font-size="34" 
        fill="#FFF7E2" 
        letter-spacing="5">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      &#8226; EST. CHICAGO &#8226;
    </textPath>
  </text>
</svg>
